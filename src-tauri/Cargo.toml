[package]
name = "chunxiao-study"
version = "0.6.0"
description = "春晓（工程名 chunxiao-study）—— 面向大学生的本地优先学习助手"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "chunxiao_study_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
calamine = "0.26"
flate2 = "1"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
