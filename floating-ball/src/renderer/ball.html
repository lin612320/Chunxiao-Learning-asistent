<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
<title>悬浮球</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { -webkit-app-region: no-drag; }

  .ball {
    width: 56px; height: 56px;
    border-radius: var(--radius, 50%);
    /* R10：默认渐变换成 DSH 品牌蓝（deepseek-450 → deepseek-500） */
    background: linear-gradient(135deg, var(--from, #5686fe), var(--to, #4176e6));
    box-shadow: 0 6px 18px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none;
    transition: transform .15s ease, box-shadow .15s ease;
    position: relative;
    overflow: hidden;
  }
  .ball::after {
    content: ''; position: absolute; inset: 4px; border-radius: inherit;
    background: radial-gradient(circle at 30% 28%, rgba(255,255,255,.5), transparent 55%);
    pointer-events: none;
  }
  .ball:hover { transform: scale(1.08); }
  .ball:active { transform: scale(.94); }

  /* 桌宠形象 */
  .face {
    position: relative; z-index: 1;
    font-size: 26px; line-height: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.3));
    transition: transform .2s;
  }

  /* R10/R11：形象图（云鲸女仆 / 未来的图片形象）。默认隐藏，`pet.art` 时由 ball.js 打开。 */
  .pet {
    position: relative; z-index: 1;
    width: 46px; height: 46px;
    display: none;
    object-fit: contain;
    object-position: center bottom;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.28));
    transition: transform .2s;
  }

  /* 拖动动画：依据皮肤 pet.dragAnim */
  @keyframes wobble { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-14deg)} 75%{transform:rotate(14deg)} }
  @keyframes spin   { to { transform: rotate(360deg); } }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  @keyframes shake  { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 60%{transform:translateX(4px)} }
  @keyframes pulse  { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
  .ball.dragging { animation: var(--anim, wobble) .6s infinite ease-in-out; }
  .ball.dragging .face { animation: inherit; }

  /* 文本拖入悬停态（手动抓取模式） */
  .ball.drop-hover {
    transform: scale(1.15);
    box-shadow: 0 0 0 3px rgba(90,167,216,.9), 0 8px 22px rgba(0,0,0,.4);
  }
  .ball.drop-hover .face::before { content: '📥'; }
  .ball.drop-hover .face { font-size: 0; }
  .ball.drop-hover .face::before { font-size: 26px; }
</style>
</head>
<body>
  <div class="ball" id="ball">
    <span class="face" id="face">🦊</span>
    <img class="pet" id="pet" alt="" aria-hidden="true" />
    <svg class="whale" id="whale" viewBox="0 0 23.16 17.04" fill="none" aria-hidden="true">
      <path d="" fill="#fff"></path>
    </svg>
  </div>
  <script src="whale.js"></script>
  <script src="ball.js"></script>
</body>
</html>
